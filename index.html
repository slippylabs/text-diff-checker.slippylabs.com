<body>

          <circle cx="20" cy="16" r="8" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>
          <circle cx="44" cy="16" r="8" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>

    <h1>TEXT DIFF CHECKER</h1>
    <p class="subtitle">Paste two blocks of text below and compare — added lines are green, removed lines are red.</p>

    <div class="two-col">
      <div class="tool-field-row">
        <label class="tool-field-label" for="text-a">Original</label>
        <textarea class="tool-textarea" id="text-a" spellcheck="false" placeholder="Paste the original text here…"></textarea>
      </div>
      <div class="tool-field-row">
        <label class="tool-field-label" for="text-b">Changed</label>
        <textarea class="tool-textarea" id="text-b" spellcheck="false" placeholder="Paste the changed text here…"></textarea>
      </div>
    </div>

    <div class="tool-controls">
      <button class="tool-btn" id="compare-btn">Compare</button>
      <span class="tool-note" id="diff-summary" style="margin:0;"></span>
    </div>

    <div class="diff-output" id="diff-output"></div>

    <div class="comm-window">
      <div class="comm-portrait">
        <svg width="36" height="36" viewBox="0 0 64 64">
          <circle cx="32" cy="34" r="22" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>
          <circle cx="20" cy="16" r="8" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>
          <circle cx="44" cy="16" r="8" fill="#1c8a52" stroke="#39ff8f" stroke-width="2"/>
          <circle cx="20" cy="16" r="3.5" fill="#050b10"/>
          <circle cx="44" cy="16" r="3.5" fill="#050b10"/>
          <ellipse cx="24" cy="32" rx="4.5" ry="5.5" fill="#050b10"/>
          <ellipse cx="40" cy="32" rx="4.5" ry="5.5" fill="#050b10"/>

          <circle cx="40" cy="30" r="1.4" fill="#39ff8f"/>

        </svg>

      <div class="comm-body">
        <div class="comm-label"><span class="dot"></span> Incoming Transmission &mdash; Slippy</div>
        <p>"Nothing you paste here ever leaves this tab."</p>
      </div>
    </div>

    <a href="https://projects.slippylabs.com/" class="hud-btn">← Back to Archive</a>
  </div>
</main>

<script>
const textA = document.getElementById('text-a');
const textB = document.getElementById('text-b');
const diffOutput = document.getElementById('diff-output');
const diffSummary = document.getElementById('diff-summary');

const MAX_CELLS = 4000000;

function diffLines(a, b) {
  const linesA = a.split('\n');
  const linesB = b.split('\n');
  const n = linesA.length, m = linesB.length;

  if (n * m > MAX_CELLS) return null;

  const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      dp[i][j] = linesA[i] === linesB[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }

  const result = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (linesA[i] === linesB[j]) { result.push({ type: 'same', text: linesA[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { result.push({ type: 'removed', text: linesA[i] }); i++; }
    else { result.push({ type: 'added', text: linesB[j] }); j++; }
  }
  while (i < n) { result.push({ type: 'removed', text: linesA[i] }); i++; }
  while (j < m) { result.push({ type: 'added', text: linesB[j] }); j++; }
  return result;
}

const MARKERS = { added: '+', removed: '-', same: ' ' };

function renderDiff() {
  const diff = diffLines(textA.value, textB.value);
  diffOutput.innerHTML = '';

  if (diff === null) {
    diffSummary.textContent = 'Too large to diff in-browser — try a smaller excerpt.';
    return;
  }

  let added = 0, removed = 0;
  const frag = document.createDocumentFragment();
  diff.forEach(line => {
    if (line.type === 'added') added++;
    if (line.type === 'removed') removed++;
    const row = document.createElement('div');
    row.className = 'diff-line ' + line.type;
    const marker = document.createElement('span');
    marker.className = 'diff-marker';
    marker.textContent = MARKERS[line.type];
    row.appendChild(marker);
    row.appendChild(document.createTextNode(line.text));
    frag.appendChild(row);
  });
  diffOutput.appendChild(frag);
  diffSummary.textContent = (added || removed) ? `+${added} / -${removed}` : 'No differences.';
}

document.getElementById('compare-btn').addEventListener('click', renderDiff);
renderDiff();
</script>
</body>
</html>
